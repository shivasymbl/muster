<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <link rel="icon" href="<%= BASE_URL %>favicon.ico" />
    <link rel="apple-touch-icon" href="<%= BASE_URL %>apple-touch-icon.png" />
    <link rel="manifest" href="<%= BASE_URL %>site.webmanifest" />
    <meta name="theme-color" content="#191D47" />
    <meta name="msapplication-navbutton-color" content="#191D47" />
    <meta name="apple-mobile-web-app-status-bar-style" content="#191D47" />
    <div style="display:none">
    {{ $defaultTitle := "Asymbl Muster: find a time that works for everyone" }}
    {{ $defaultDescription := "Asymbl Muster helps a group find a time that works for everyone. Send one link, connect calendars, and see the overlap." }}
    {{ $defaultOgImage := "/og-muster.png" }}
    </div>
    <title>{{ or .title $defaultTitle }}</title>
    <meta
      name="description"
      content="{{or .description $defaultDescription }}"
    />
    <meta property="og:title" content="{{or .ogTitle $defaultTitle}}" />
    <meta property="og:description" content="{{or .ogDescription $defaultDescription }}" />
    <meta property="og:image" content="{{or .ogImage $defaultOgImage }}" />
    <meta property="og:image:secure_url" content="{{or .ogImage $defaultOgImage }}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{or .ogTitle $defaultTitle}}" />
    <meta name="twitter:description" content="{{or .ogDescription $defaultDescription }}" />
    <meta name="twitter:image" content="{{or .ogImage $defaultOgImage }}" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@mdi/font@latest/css/materialdesignicons.min.css"
    />
  </head>
  <body>
    <noscript>
      <strong
        >We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work
        properly without JavaScript enabled. Please enable it to
        continue.</strong
      >
    </noscript>
    <div id="app"></div>
    <!-- built files will be auto injected -->
  </body>
</html>
